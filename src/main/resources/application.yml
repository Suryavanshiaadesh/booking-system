spring:
  application:
    name: booking-system
  datasource:
    url: jdbc:h2:mem:bookingsystem;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-change-me-please-32bytes!}
    expiry-ms: 86400000
  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:admin123}
  booking:
    open-hour: 9
    close-hour: 17

